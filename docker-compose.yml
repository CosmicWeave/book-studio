services:
  # ─── MariaDB ────────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: bookstudio
      MARIADB_USER: bookstudio
      MARIADB_PASSWORD: ${DB_PASSWORD:-bookstudio}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  # ─── Backend (Hono/Node.js) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://bookstudio:${DB_PASSWORD:-bookstudio}@db:3306/bookstudio
      PORT: 3001
      HOST: 0.0.0.0
      FILES_DIR: /data/files
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      ANYTHINGLLM_URL: ${ANYTHINGLLM_URL:-http://host.docker.internal:3001}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KOKORO_URL: ${KOKORO_URL:-http://host.docker.internal:8880}
      CORS_ORIGINS: http://localhost,http://localhost:80
    volumes:
      - files_data:/data/files
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Frontend + Nginx reverse proxy ─────────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  db_data:
  files_data:

networks:
  internal:
    driver: bridge
